<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">Score</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Meilleur</span>
          <span class="score-value" id="best-score">0</span>
        </div>
      </div>
    </header>

    <div class="controls-row">
      <p class="instructions">Utilisez les flèches pour déplacer les tuiles. Fusionnez-les pour atteindre 2048 !</p>
      <div class="controls-buttons">
        <button class="new-game-btn" id="new-game">Nouvelle partie</button>
        <button class="leaderboard-btn" id="leaderboard-btn">Classement</button>
      </div>
    </div>

    <div class="board-container">
      <div class="grid-background" id="grid-background"></div>
      <div class="tile-container" id="tile-container"></div>

      <div class="overlay hidden" id="overlay">
        <p class="overlay-message hidden" id="overlay-message"></p>
        <form class="name-entry-form hidden" id="name-entry-form">
          <label for="name-entry-input">Votre nom (max 12 caractères):</label>
          <input type="text" id="name-entry-input" maxlength="12" placeholder="Joueur" autocomplete="off">
          <button type="submit" class="overlay-btn" id="name-entry-submit">Sauvegarder</button>
        </form>
        <div class="overlay-actions">
          <button class="overlay-btn" id="overlay-continue">Continuer</button>
          <button class="overlay-btn" id="overlay-retry">Nouvelle partie</button>
        </div>
      </div>

      <div class="leaderboard-modal hidden" id="leaderboard-modal">
        <div class="leaderboard-content">
          <div class="leaderboard-header">
            <h2>Classement Top 10</h2>
            <button class="leaderboard-close" id="leaderboard-close">×</button>
          </div>
          <div class="leaderboard-list" id="leaderboard-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="game-logic.js"></script>
  <script src="script.js"></script>
</body>
</html>
